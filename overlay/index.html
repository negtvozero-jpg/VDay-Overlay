<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hearts Overlay</title>
  <style>
    html, body {
      margin:0;
      width:1920px;
      height:1080px;
      background:transparent;
      overflow:hidden;
      font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    canvas {
      position:fixed;
      inset:0;
      width:1920px;
      height:1080px;
      display:block;
    }

    #overlayGearBtn {
      position:fixed;
      top:16px;
      left:16px;
      width:56px;
      height:56px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.24);
      background:rgba(32,24,56,0.82);
      color:#fff;
      display:grid;
      place-items:center;
      font-size:26px;
      cursor:pointer;
      box-shadow:0 18px 50px rgba(0,0,0,0.45);
      backdrop-filter:blur(10px);
      z-index:10000;
      opacity:0;
      pointer-events:none;
      transition:opacity 160ms ease;
      user-select:none;
    }

    #overlayGearBtn.visible,
    #overlayGearBtn.open {
      opacity:1;
      pointer-events:auto;
    }

    #overlayUiPanel {
      position:fixed;
      top:88px;
      left:16px;
      width:min(620px, calc(100vw - 32px));
      height:min(820px, calc(100vh - 120px));
      border-radius:18px;
      border:1px solid rgba(255, 255, 255, 0);
      background:rgba(24, 18, 44, 0);
      box-shadow:0 18px 50px rgba(0, 0, 0, 0);
      backdrop-filter:blur(10px);
      overflow:hidden;
      z-index:9999;
      display:none;
    }

    #overlayUiPanel.open {
      display:block;
    }

    #overlayUiFrame {
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:transparent;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <button id="overlayGearBtn" type="button" aria-label="Open settings">⚙</button>

  <div id="overlayUiPanel">
    <iframe
      id="overlayUiFrame"
      data-src="/ui/index.html?embedded=1"
      title="Hearts UI"
      allowtransparency="true"
    ></iframe>
  </div>

  <script src="./overlay/overlay.js"></script>
  <script src="./overlay/overlay-premium.js"></script>

  <script>
    (() => {
      const gear = document.getElementById("overlayGearBtn");
      const panel = document.getElementById("overlayUiPanel");
      let hideTimer = 0;

      function isOpen() {
        return panel.classList.contains("open");
      }

      function showGear() {
        gear.classList.add("visible");
        clearTimeout(hideTimer);
        if (!isOpen()) {
          hideTimer = setTimeout(() => {
            gear.classList.remove("visible");
          }, 1600);
        }
      }

      function setOpen(open) {
        panel.classList.toggle("open", open);
        gear.classList.toggle("open", open);
      
        if (open) {
          gear.classList.add("visible");
          clearTimeout(hideTimer);
      
          const frame = document.getElementById("overlayUiFrame");
      
          if (!frame.getAttribute("src")) {
            frame.setAttribute("src", frame.dataset.src);
          } else {
            requestAnimationFrame(() => {
              frame.contentWindow?.dispatchEvent(new Event("resize"));
            });
          }
        } else {
          showGear();
        }
      }

      window.addEventListener("mousemove", showGear, { passive:true });
      window.addEventListener("pointermove", showGear, { passive:true });

      gear.addEventListener("click", (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        setOpen(!isOpen());
      });

      window.addEventListener("keydown", (ev) => {
        if (ev.key === "Escape" && isOpen()) setOpen(false);
      });
    })();
  </script>
</body>
</html>
